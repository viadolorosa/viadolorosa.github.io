    <title>Коллтрекинг</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            color: #1e293b;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        h1 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 28px;
            letter-spacing: -0.02em;
        }

        .phones-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .phone-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #f8fafc;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        .phone-item:hover {
            border-color: #38bdf8;
            background: #f0f9ff;
            transform: translateY(-2px);
        }

        .phone-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            font-weight: 600;
        }

        .phone-number {
            color: #0284c7;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .phone-number:hover {
            color: #0369a1;
        }
    </style>

    <!-- Виджет Novofon -->
    <script type="text/javascript" async src="https://widget.novofon.ru/novofon.js?k=cakbuFqNIoqmPlC3CKakPIsuHvOsOGri"></script>

            <div class="phone-item">
                <span class="phone-label">Санкт-Петербург</span>
                <a href="tel:+78129999999" class="phone-spb novofon-phone phone-number" data-phone="78129999999">
                    +7 (812) 999-99-99
                </a>
            </div>

            <!-- Телефон для Москвы -->
            <div class="phone-item">
                <span class="phone-label">Москва</span>
                <a href="tel:+74959999999" class="phone-msk novofon-phone phone-number" data-phone="74959999999">
                    +7 (495) 999-99-99
                </a>
            </div>
        </div>
    </div>

</body>
